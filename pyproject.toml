[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-machine"
version = "0.1.0"
description = "Trending YouTube/Instagram topics -> scripts -> short-form videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
media = [
  "edge-tts>=6.1",
  "faster-whisper>=1.0",
  "moviepy>=2.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
cm = "content_machine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/content_machine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
